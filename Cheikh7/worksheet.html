<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quest Academy Weekly Worksheet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; color: #111111; font-family: Georgia, "Times New Roman", serif; line-height: 1.5; }
  .sheet { max-width: 820px; margin: 0 auto; padding: 40px 48px 80px; }
  .wsHeader { border-bottom: 3px solid #111; padding-bottom: 12px; margin-bottom: 8px; }
  .wsHeader h1 { margin: 0 0 4px; font-size: 26px; }
  .wsHeader .wk { font-size: 18px; font-weight: bold; }
  .wsMeta { display: flex; flex-wrap: wrap; gap: 24px; margin: 14px 0 6px; font-size: 15px; }
  .wsMeta .line { flex: 1 1 240px; }
  .wsMeta .blank { display: inline-block; border-bottom: 1px solid #111; min-width: 180px; height: 1.1em; }
  .stds { font-size: 13px; color: #333; margin: 6px 0 20px; }
  .stds span { display: inline-block; border: 1px solid #555; border-radius: 4px; padding: 2px 8px; margin: 2px 4px 2px 0; }
  .subject { margin: 0 0 26px; page-break-inside: avoid; }
  .subject h2 { font-size: 19px; border-bottom: 1px solid #999; padding-bottom: 4px; margin: 0 0 4px; }
  .subject .meta { font-size: 13px; color: #444; margin: 0 0 10px; }
  ol.problems { margin: 0; padding-left: 26px; }
  ol.problems li { margin: 0 0 16px; }
  ol.problems .qtext { display: block; margin-bottom: 8px; }
  .answerLine { display: block; border-bottom: 1px solid #111; height: 1.4em; width: 100%; }
  .answerKeyPage { break-before: page; page-break-before: always; padding-top: 20px; }
  .answerKeyPage h1 { font-size: 24px; border-bottom: 3px solid #111; padding-bottom: 8px; }
  .answerKeyPage .subject h2 { border-bottom: 1px solid #ccc; }
  ol.keyList { margin: 0; padding-left: 26px; }
  ol.keyList li { margin: 0 0 6px; font-size: 14px; }
  ol.keyList .a { font-weight: bold; }
  .printBtn { position: fixed; right: 20px; bottom: 20px; padding: 14px 22px; font-size: 16px; font-weight: bold; background: #111; color: #fff; border: 0; border-radius: 8px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.3); z-index: 999; }
  .backLink { position: fixed; left: 20px; bottom: 20px; font-size: 14px; color: #333; text-decoration: none; border: 1px solid #999; border-radius: 8px; padding: 10px 16px; background: #fff; z-index: 999; }
  .missionNote { font-style: italic; font-size: 13px; color: #444; margin: 2px 0 10px; }
  .err { color: #900; font-size: 16px; }
  @media print {
    .printBtn, .backLink { display: none !important; }
    .sheet { padding: 0; max-width: none; }
    body { font-size: 12pt; }
  }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<a class="backLink" href="index.html">← Back to Quest Academy</a>
<button class="printBtn" onclick="window.print()">🖨️ Print / Save as PDF</button>

<script src="data/weekly_grade5.js"></script>
<script src="data/weekly_grade7.js"></script>
<script>
(function () {
  function escHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  var SUBJECT_LABELS = { math: 'Math', ela: 'English Language Arts', science: 'Science', social: 'Social Studies' };
  var SUBJECT_ORDER = ['math', 'ela', 'science', 'social'];

  var params = new URLSearchParams(window.location.search);
  var grade = params.get('grade') === '5' ? '5' : '7';
  var week = parseInt(params.get('week') || '1', 10);
  if (!(week >= 1 && week <= 8)) week = 1;

  var data = grade === '5'
    ? (typeof WEEKLY_G5 !== 'undefined' ? WEEKLY_G5 : [])
    : (typeof WEEKLY_G7 !== 'undefined' ? WEEKLY_G7 : []);
  var gradeLabel = grade === '5' ? '5th Grade' : '7th Grade';

  var sheet = document.getElementById('sheet');
  var unit = data.filter(function (w) { return w.week === week; })[0] || data[0];
  if (!unit) {
    sheet.innerHTML = '<p class="err">Sorry, that week could not be found.</p>';
    return;
  }

  function orderedSubjects() {
    var out = [];
    SUBJECT_ORDER.forEach(function (s) {
      var subj = unit.subjects.filter(function (x) { return x.s === s; })[0];
      if (subj) out.push(subj);
    });
    return out;
  }

  var subjects = orderedSubjects();

  // Standards codes chips
  var stds = subjects.map(function (s) { return '<span>' + escHtml(s.std) + '</span>'; }).join('');

  // Header + worksheet
  var html = '' +
    '<div class="wsHeader">' +
      '<h1>Quest Academy — Weekly Worksheet</h1>' +
      '<div class="wk">' + gradeLabel + ' · Week ' + unit.week + ': ' + escHtml(unit.title) + '</div>' +
    '</div>' +
    '<div class="wsMeta">' +
      '<div class="line">Name: <span class="blank"></span></div>' +
      '<div class="line">Date: <span class="blank"></span></div>' +
    '</div>' +
    '<div class="stds"><strong>Ohio Standards:</strong> ' + stds + '</div>';

  subjects.forEach(function (subj) {
    html += '<section class="subject">' +
      '<h2>' + escHtml(SUBJECT_LABELS[subj.s] || subj.s) + ' — ' + escHtml(subj.concept) + '</h2>' +
      '<p class="meta">Standard: ' + escHtml(subj.std) + '</p>' +
      '<p class="missionNote">Mission: ' + escHtml(subj.sprint) + '</p>' +
      '<ol class="problems">';
    subj.problems.forEach(function (p) {
      html += '<li><span class="qtext">' + escHtml(p[0]) + '</span><span class="answerLine"></span></li>';
    });
    html += '</ol></section>';
  });

  // Answer key page
  html += '<div class="answerKeyPage">' +
    '<h1>Answer Key — ' + gradeLabel + ' Week ' + unit.week + '</h1>' +
    '<p class="missionNote">For parents/educators. Answers are sample responses for open-ended items.</p>';
  subjects.forEach(function (subj) {
    html += '<section class="subject">' +
      '<h2>' + escHtml(SUBJECT_LABELS[subj.s] || subj.s) + ' — ' + escHtml(subj.concept) + '</h2>' +
      '<ol class="keyList">';
    subj.problems.forEach(function (p) {
      html += '<li>' + escHtml(p[0]) + ' <span class="a">→ ' + escHtml(p[1]) + '</span></li>';
    });
    html += '</ol></section>';
  });
  html += '</div>';

  sheet.innerHTML = html;
  document.title = 'Worksheet — ' + gradeLabel + ' Week ' + unit.week;
})();
</script>
</body>
</html>
